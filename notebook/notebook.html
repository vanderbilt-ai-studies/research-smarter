<title>Research Smarter Notebook</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;600;700&display=swap">
<style>
  /* Layout: a sticky top bar, then one reading column of project panels; the
     phase track mirrors the skill's six phases. Colors echo the mind map's
     blue-to-red saturation scale. */
  :root {
    --bg: #f4f6fa; --surface: #ffffff; --fg: #18202f; --muted: #5a6478;
    --line: #dce2ec; --accent: #2457c5; --accent-soft: #e5edfc;
    --done: #1f7a52; --done-soft: #e0f3ea; --warn: #8a5a00; --warn-soft: #fbf0d9;
    --bad: #a3262a; --bad-soft: #f8e3e3; --quote: #f0f3f9;
    --font-display: "Space Grotesk", "Inter", system-ui, sans-serif;
    --font-body: "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
    --font-mono: "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace;
  }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
    --bg: #0f1420; --surface: #171e2c; --fg: #e5e9f1; --muted: #9aa4b8;
    --line: #2a3346; --accent: #86a8ff; --accent-soft: #1d2a47;
    --done: #79d1a4; --done-soft: #16352a; --warn: #f0c46b; --warn-soft: #3a2e14;
    --bad: #f19a9c; --bad-soft: #3d1c1e; --quote: #1c2436; color-scheme: dark } }
  :root[data-theme="dark"] {
    --bg: #0f1420; --surface: #171e2c; --fg: #e5e9f1; --muted: #9aa4b8;
    --line: #2a3346; --accent: #86a8ff; --accent-soft: #1d2a47;
    --done: #79d1a4; --done-soft: #16352a; --warn: #f0c46b; --warn-soft: #3a2e14;
    --bad: #f19a9c; --bad-soft: #3d1c1e; --quote: #1c2436; color-scheme: dark }

  html, body { background: var(--bg); }
  body { color: var(--fg); font: 15px/1.6 var(--font-body); }
  body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--surface); }
  .wrap { max-width: 760px; margin: 0 auto;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px)); }
  header.bar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5;
    background: var(--surface); border-bottom: 1px solid var(--line); }
  header.bar .wrap { display: flex; align-items: center; justify-content: space-between; gap: 12px;
    flex-wrap: wrap; padding-block: 10px; }
  .brand { font: 600 17px/1.2 var(--font-display); letter-spacing: -0.01em; margin: 0; }
  .brand span { color: var(--muted); font-weight: 500; }
  .actions { display: flex; gap: 8px; flex-wrap: wrap; }
  main.wrap { display: grid; gap: 18px; padding-block: 22px 48px; }

  button, label.button { font: 600 14px/1 var(--font-body); border-radius: 8px; padding: 9px 14px; cursor: pointer;
    border: 1px solid var(--line); background: var(--surface); color: var(--fg); display: inline-block; }
  button.primary, label.button.primary { background: var(--accent); border-color: var(--accent); color: var(--surface); }
  button:disabled { opacity: .5; cursor: default; }
  button:focus-visible, textarea:focus-visible, a:focus-visible, label.button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .visually-hidden { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden;
    clip: rect(0 0 0 0); white-space: nowrap; border: 0; opacity: 0; }

  .notice { border-radius: 10px; padding: 10px 14px; font-size: 14px; background: var(--accent-soft); color: var(--fg); }
  .notice.warn { background: var(--warn-soft); }
  .notice.bad { background: var(--bad-soft); }
  .notice.ok { background: var(--done-soft); }

  .panel { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 18px;
    display: grid; gap: 12px; min-width: 0; }
  .eyebrow { font: 500 12px/1.2 var(--font-mono); text-transform: uppercase; letter-spacing: .08em; color: var(--muted); margin: 0; }
  h2 { font: 600 20px/1.25 var(--font-display); margin: 0; text-wrap: balance; }
  h3 { font: 600 15px/1.3 var(--font-display); margin: 0; }
  p { margin: 0; }
  .muted { color: var(--muted); }

  .meta { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 10px 18px; margin: 0; }
  .meta div { min-width: 0; }
  .meta dt { font-size: 12px; color: var(--muted); }
  .meta dd { margin: 0; overflow-wrap: anywhere; }

  .track { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 6px; list-style: none; margin: 0; padding: 0; }
  .track li { display: grid; gap: 6px; font-size: 12px; color: var(--muted); min-width: 0; }
  .track li::before { content: ""; height: 6px; border-radius: 3px; background: var(--line); }
  .track li.done::before { background: var(--done); }
  .track li.current::before { background: var(--accent); }
  .track li.current { color: var(--fg); font-weight: 600; }
  .track li .name { overflow-wrap: normal; }
  @media (max-width: 560px) { .track li .name { display: none; } .track li { text-align: center; } }

  blockquote.words { margin: 0; padding: 12px 14px; background: var(--quote); border-radius: 8px;
    font-size: 16px; line-height: 1.55; overflow-wrap: anywhere; }
  .words.empty { color: var(--muted); font-style: italic; font-size: 15px; }
  .label { font-size: 13px; font-weight: 600; color: var(--muted); }

  .sources { display: grid; gap: 10px; margin: 0; padding: 0; list-style: none; }
  .sources li { border-top: 1px solid var(--line); padding-top: 10px; display: grid; gap: 4px; min-width: 0; overflow-wrap: anywhere; }
  .sources li:first-child { border-top: 0; padding-top: 0; }
  .tags { display: flex; gap: 6px; flex-wrap: wrap; }
  .tag { font-size: 12px; padding: 1px 8px; border-radius: 999px; background: var(--accent-soft); }
  a { color: var(--accent); }

  ul.plain { margin: 0; padding-left: 18px; display: grid; gap: 6px; }

  .empty { text-align: left; display: grid; gap: 14px; }
  .empty h2 { font-size: 24px; }
  .choices { display: flex; gap: 10px; flex-wrap: wrap; }
  textarea { width: 100%; min-height: 180px; font: 13px/1.5 var(--font-mono); color: var(--fg); background: var(--bg);
    border: 1px solid var(--line); border-radius: 8px; padding: 10px; box-sizing: border-box; resize: vertical; }
  .confirm { display: grid; gap: 10px; }

  nav.tabs { display: flex; gap: 4px; flex: 1 1 auto; }
  nav.tabs a { font: 600 14px/1 var(--font-body); text-decoration: none; color: var(--muted);
    padding: 8px 10px; border-radius: 8px; }
  nav.tabs a[aria-current="page"] { color: var(--fg); background: var(--accent-soft); }

  .src-card { border: 1px solid var(--line); border-radius: 10px; padding: 14px; display: grid; gap: 10px; min-width: 0; overflow-wrap: anywhere; }
  .src-card .cite { font-weight: 500; }
  .controls { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 10px; }
  .controls label, .form label { display: grid; gap: 4px; font-size: 12px; font-weight: 600; color: var(--muted); min-width: 0; }
  select, input[type="text"] { font: 14px/1.3 var(--font-body); color: var(--fg); background: var(--surface);
    border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; min-width: 0; width: 100%; box-sizing: border-box; }
  select:focus-visible, input[type="text"]:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
  .unlabeled { color: var(--warn); }
  .row-actions { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  .form { display: grid; gap: 10px; }
  .summary { display: flex; gap: 8px; flex-wrap: wrap; }
  .count { font-size: 13px; padding: 3px 10px; border-radius: 999px; background: var(--quote); font-variant-numeric: tabular-nums; }

  /* Reader */
  .article { max-height: 42vh; overflow: auto; white-space: pre-wrap; font: 14px/1.65 var(--font-body);
    background: var(--quote); border-radius: 8px; padding: 12px 14px; overflow-wrap: anywhere; }
  .steps { display: flex; gap: 6px; list-style: none; margin: 0; padding: 0; flex-wrap: wrap; }
  .steps li { font: 600 12px/1 var(--font-mono); padding: 6px 9px; border-radius: 999px; background: var(--quote); color: var(--muted); }
  .steps li.done { background: var(--done-soft); color: var(--done); }
  .steps li.current { background: var(--accent); color: var(--surface); }
  .ask { font: 600 19px/1.3 var(--font-display); margin: 0; text-wrap: balance; }
  .thread { display: grid; gap: 10px; }
  .msg { border-radius: 10px; padding: 10px 12px; overflow-wrap: anywhere; white-space: pre-wrap; display: grid; gap: 8px; }
  .msg.student { background: var(--accent-soft); justify-self: end; max-width: 92%; }
  .msg.coach { background: var(--surface); border: 1px solid var(--line); max-width: 96%; }
  .msg .who { font: 600 11px/1 var(--font-mono); text-transform: uppercase; letter-spacing: .06em; color: var(--muted); }
  .msg blockquote { margin: 0; padding: 8px 10px; border-left: 3px solid var(--accent); background: var(--quote); border-radius: 0 6px 6px 0; font-size: 14px; }
  textarea.answer { min-height: 110px; font: 15px/1.55 var(--font-body); }
  .card-qa { display: grid; gap: 12px; margin: 0; }
  .card-qa dt { font-size: 13px; font-weight: 600; color: var(--muted); }
  .card-qa dd { margin: 0; white-space: pre-wrap; overflow-wrap: anywhere; }
  @media (prefers-reduced-motion: no-preference) { button { transition: background-color .15s, border-color .15s; } }
</style>

<header class="bar">
  <div class="wrap">
    <p class="brand">Research Smarter <span>Notebook</span></p>
    <nav class="tabs" id="tabs" aria-label="Notebook views" hidden>
      <a href="#research" id="tab-research" data-view="research">My Research</a>
      <a href="#sources" id="tab-sources" data-view="sources">Sources</a>
    </nav>
    <button type="button" id="btn-read">Read a source</button>
    <div class="actions" id="actions" hidden>
      <button type="button" id="btn-replace">Load a different log</button>
      <button type="button" class="primary" id="btn-save">Save research log</button>
    </div>
  </div>
</header>

<main class="wrap" id="main">
  <div class="notice" id="status" role="status" aria-live="polite" hidden></div>
  <div id="view"></div>
</main>

<input type="file" id="file" class="visually-hidden" accept=".md,.markdown,.txt,text/markdown,text/plain" tabindex="-1">
<input type="file" id="pdf" class="visually-hidden" accept=".pdf,application/pdf,.txt,text/plain" tabindex="-1">

<script id="log-format">
/* Research log parsing and saving. Pure functions, no page access, so they can be
   tested on their own. The log's text is kept exactly as written: saving updates
   the "Last updated" date, and editing sources rewrites only the sources table. */
var LogFormat = (function () {
  function norm(md) { return String(md).replace(/\r\n?/g, "\n"); }

  function isLog(md) {
    return /^#\s*Research Smarter\s*·\s*Research log\s*$/m.test(md) ||
      (/^##\s*Where I am\s*$/m.test(md) && /^##\s*My research question/m.test(md));
  }

  function splitSections(md) {
    var lines = md.split("\n"), pre = [], sections = [], cur = null;
    lines.forEach(function (line) {
      var m = /^##\s+(.+?)\s*$/.exec(line);
      if (m && !/^###/.test(line)) { cur = { heading: m[1], lines: [line] }; sections.push(cur); }
      else if (cur) { cur.lines.push(line); }
      else { pre.push(line); }
    });
    return { pre: pre, sections: sections };
  }

  function findSection(sections, startsWith) {
    var key = startsWith.toLowerCase();
    for (var i = 0; i < sections.length; i++) {
      if (sections[i].heading.toLowerCase().indexOf(key) === 0) return sections[i];
    }
    return null;
  }

  function field(lines, label) {
    var re = new RegExp("^-\\s*\\*\\*" + label.replace(/[.*+?^${}()|[\]\\]/g, "\\$&") + ":\\*\\*\\s*(.*)$");
    for (var i = 0; i < lines.length; i++) {
      var m = re.exec(lines[i]);
      if (m) {
        var parts = [m[1]];
        for (var j = i + 1; j < lines.length && /^\s{2,}\S/.test(lines[j]); j++) parts.push(lines[j].trim());
        return parts.join(" ").trim();
      }
    }
    return "";
  }

  function unquote(s) {
    var t = (s || "").trim();
    var m = /^["“]([\s\S]*)["”]$/.exec(t);
    return m ? { text: m[1], quoted: true } : { text: t, quoted: false };
  }

  function isPlaceholder(s) {
    var t = (s || "").trim().toLowerCase();
    return !t || t.indexOf("not written yet") === 0 || /^\[.*\]$/.test(t);
  }

  /* Splits one Markdown table row into cells. A pipe written as \| stays inside its cell. */
  function cells(l) {
    var s = l.trim().replace(/^\|/, "").replace(/(^|[^\\])\|$/, "$1");
    var out = [], cur = "";
    for (var i = 0; i < s.length; i++) {
      if (s[i] === "\\" && s[i + 1] === "|") { cur += "|"; i++; continue; }
      if (s[i] === "|") { out.push(cur.trim()); cur = ""; continue; }
      cur += s[i];
    }
    out.push(cur.trim());
    return out;
  }

  function table(lines) {
    var rows = lines.filter(function (l) { return /^\s*\|/.test(l); });
    if (rows.length < 2) return { head: null, rows: [] };
    var head = cells(rows[0]);
    return {
      head: head,
      rows: rows.slice(2).map(cells).filter(function (c) {
        return c.some(function (x) { return x !== ""; });
      }).map(function (c) {
        var o = {};
        head.forEach(function (h, i) { o[h] = c[i] || ""; });
        return o;
      })
    };
  }

  /* ---- Sources: the student's own judgments, kept in the log's sources table ---- */
  var STATUSES = ["found", "skimmed", "read closely", "verified"];
  var LABELS = ["supports", "complicates"];
  var COLS = { citation: "Citation", link: "Link or DOI", subq: "Sub-question",
               label: "Supports or complicates", verified: "Verified?", status: "Reading status" };
  var DEFAULT_HEAD = ["Citation", "Link or DOI", "Sub-question", "Supports or complicates", "Verified?"];

  function toSource(row) {
    var s = { other: {} }, known = {};
    Object.keys(COLS).forEach(function (k) { s[k] = row[COLS[k]] || ""; known[COLS[k]] = true; });
    /* A status the log doesn't record stays blank. Filling in a default would put a
       claim in the student's log they never made (for example "found" on sources
       they had already evaluated). */
    var st = s.status.trim().toLowerCase();
    s.status = STATUSES.indexOf(st) >= 0 ? st : s.status.trim();
    Object.keys(row).forEach(function (h) { if (!known[h]) s.other[h] = row[h]; });
    return s;
  }

  /* A source the student adds in the notebook. It has no "supports or complicates"
     label: only the student sets that (SPEC R10.5, R2.4). */
  function newSource(f) {
    f = f || {};
    return { citation: String(f.citation || "").trim(), link: String(f.link || "").trim(),
             subq: String(f.subq || "").trim(), label: "", verified: "", status: "found", other: {} };
  }

  function escCell(v) { return String(v == null ? "" : v).replace(/\r?\n/g, " ").replace(/\|/g, "\\|").trim(); }

  /* Returns the log with its sources table rewritten from `sources`. Every other
     line of the log is kept exactly as it was. */
  function withSources(raw, sources, head) {
    var md = norm(raw);
    var header = (head && head.length ? head : DEFAULT_HEAD).slice();
    if (header.indexOf(COLS.status) < 0) header.push(COLS.status);
    var byName = {};
    Object.keys(COLS).forEach(function (k) { byName[COLS[k]] = k; });
    var tableLines = ["| " + header.join(" | ") + " |", "|" + header.map(function () { return "---"; }).join("|") + "|"];
    sources.forEach(function (s) {
      tableLines.push("| " + header.map(function (h) {
        var k = byName[h];
        return escCell(k ? s[k] : (s.other || {})[h]);
      }).join(" | ") + " |");
    });

    var parts = splitSections(md);
    var sec = findSection(parts.sections, "Sources found");
    if (sec) {
      var L = sec.lines, start = -1, end = -1;
      for (var i = 1; i < L.length; i++) {
        if (/^\s*\|/.test(L[i])) { if (start < 0) start = i; end = i; }
        else if (start >= 0) break;
      }
      if (start >= 0) {
        L.splice.apply(L, [start, end - start + 1].concat(tableLines));
      } else {
        var at = 1;
        while (at < L.length && L[at].trim() === "") at++;
        L.splice.apply(L, [at, 0].concat(tableLines, [""]));
      }
    } else {
      var fresh = { heading: "Sources found so far", lines: ["## Sources found so far", ""].concat(tableLines, [""]) };
      var idx = -1;
      for (var j = 0; j < parts.sections.length; j++) {
        if (/^(stress-tested|key decisions)/i.test(parts.sections[j].heading)) { idx = j; break; }
      }
      if (idx < 0) {
        var last = parts.sections[parts.sections.length - 1];
        if (last && last.lines[last.lines.length - 1].trim() !== "") last.lines.push("");
        parts.sections.push(fresh);
      } else {
        parts.sections.splice(idx, 0, fresh);
      }
    }
    var all = parts.pre.slice();
    parts.sections.forEach(function (s) { all = all.concat(s.lines); });
    return all.join("\n");
  }

  function bullets(lines) {
    return lines.filter(function (l) { return /^-\s+\S/.test(l); }).map(function (l) { return l.replace(/^-\s+/, "").trim(); });
  }

  function phases(s) {
    var out = [], re = /Phase\s*(\d)/gi, m;
    while ((m = re.exec(s || ""))) { var n = Number(m[1]); if (out.indexOf(n) < 0) out.push(n); }
    return out;
  }

  function parse(raw) {
    var md = norm(raw);
    if (!isLog(md)) return { ok: false, reason: "not_log" };
    var parts = splitSections(md);
    var S = function (h) { var s = findSection(parts.sections, h); return s ? s.lines : []; };
    var where = S("Where I am"), asg = S("Assignment"), mine = S("My research question");
    var lu = /\*\*Last updated:\*\*\s*(.*)$/m.exec(parts.pre.join("\n"));
    var phaseText = field(where, "Current phase and step");
    var cur = phases(phaseText);
    var number = cur.length ? cur[0] : null;
    var complete = /complete/i.test(phaseText);
    /* "Phase 0 complete; ready to start Phase 1": the current step is the next
       core phase. After Phase 4 the only phase left is optional, so none is current. */
    var current = number === null ? null : (complete ? (number < 4 ? number + 1 : null) : number);
    var q = unquote(field(mine, "Research question"));
    var p = unquote(field(mine, "Working position"));
    var c = unquote(field(mine, "Strongest counterargument and my response"));
    var srcTable = table(S("Sources found"));
    return {
      ok: true,
      lastUpdated: lu ? lu[1].trim() : "",
      phase: {
        text: phaseText,
        number: number,
        complete: complete,
        current: current,
        exitChecks: phases(field(where, "Exit checks passed")),
        middle: field(where, "What I was in the middle of")
      },
      assignment: {
        assignment: field(asg, "Assignment"),
        discipline: field(asg, "Discipline"),
        sources: field(asg, "Source requirements and citation style"),
        researchType: field(asg, "Research type and working position"),
        challenge: field(asg, "Challenge level")
      },
      question: { text: q.text, quoted: q.quoted, written: !isPlaceholder(q.text) },
      position: { text: p.text, quoted: p.quoted, written: !isPlaceholder(p.text) },
      counter: { text: c.text, quoted: c.quoted, written: !isPlaceholder(c.text) },
      plan: table(S("Research plan")).rows,
      planSupport: field(S("Research plan"), "What would support my position"),
      planComplicate: field(S("Research plan"), "What would complicate it"),
      sources: srcTable.rows.map(toSource),
      sourcesHeader: srcTable.head,
      readingCards: parseCards(S("Reading cards")),
      tested: bullets(S("Stress-tested")),
      decisions: bullets(S("Key decisions"))
    };
  }

  /* ---- Reading cards: "what this source can and can't tell me", in the student's words ---- */

  function parseCards(lines) {
    var cards = [], cur = null;
    lines.slice(1).forEach(function (l) {
      var h = /^###\s+(.+?)\s*$/.exec(l);
      if (h) { cur = { citation: h[1], date: "", answers: [] }; cards.push(cur); return; }
      if (!cur) return;
      var d = /^\*Read on ([^*]+)\*\s*$/.exec(l.trim());
      if (d) { cur.date = d[1].trim(); return; }
      var m = /^-\s*\*\*(.+?):\*\*\s?(.*)$/.exec(l);
      if (m) { cur.answers.push({ label: m[1], answer: m[2] }); return; }
      if (/^\s{2,}\S/.test(l) && cur.answers.length) {
        var a = cur.answers[cur.answers.length - 1]; a.answer += "\n" + l.replace(/^\s{2}/, "");
      }
    });
    return cards;
  }

  function cardLines(card) {
    var out = ["### " + String(card.citation || "Untitled source").replace(/\s+/g, " ").trim(),
               "*Read on " + card.date + "*", ""];
    card.answers.forEach(function (a) {
      var ls = String(a.answer || "").replace(/\r\n?/g, "\n").split("\n");
      out.push("- **" + a.label + ":** " + ls[0]);
      ls.slice(1).forEach(function (l) { out.push("  " + l); });
    });
    out.push("");
    return out;
  }

  /* Adds one reading card to the log's "Reading cards" section (creating the
     section if needed). Every other line of the log is kept exactly. */
  function withReadingCard(raw, card) {
    var md = norm(raw), parts = splitSections(md);
    var sec = findSection(parts.sections, "Reading cards");
    if (sec) {
      var L = sec.lines;
      while (L.length > 1 && L[L.length - 1].trim() === "") L.pop();
      L.push("");
      L.push.apply(L, cardLines(card));
    } else {
      var fresh = { heading: "Reading cards", lines: ["## Reading cards", ""].concat(cardLines(card)) };
      var idx = -1;
      for (var j = 0; j < parts.sections.length; j++) {
        if (/^(stress-tested|key decisions)/i.test(parts.sections[j].heading)) { idx = j; break; }
      }
      if (idx < 0) {
        var last = parts.sections[parts.sections.length - 1];
        if (last && last.lines[last.lines.length - 1].trim() !== "") last.lines.push("");
        parts.sections.push(fresh);
      } else {
        parts.sections.splice(idx, 0, fresh);
      }
    }
    var all = parts.pre.slice();
    parts.sections.forEach(function (s) { all = all.concat(s.lines); });
    return all.join("\n");
  }

  /* A reading card on its own, for a student reading without a project. */
  function cardFile(card) {
    return ["# Research Smarter · Reading card", ""].concat(cardLines(card)).join("\n");
  }

  function localDate(d) {
    d = d || new Date();
    var p = function (n) { return (n < 10 ? "0" : "") + n; };
    return d.getFullYear() + "-" + p(d.getMonth() + 1) + "-" + p(d.getDate());
  }

  /* Returns the log with only its "Last updated" date changed to `date`. */
  function save(raw, date) {
    var md = norm(raw);
    if (/\*\*Last updated:\*\*/.test(md)) {
      return md.replace(/(\*\*Last updated:\*\*)[ \t]*[^\n]*/, "$1 " + date);
    }
    return md.replace(/^(#\s*Research Smarter\s*·\s*Research log\s*\n)/m, "$1\n**Last updated:** " + date + "\n");
  }

  return { parse: parse, save: save, localDate: localDate, isLog: isLog,
           withSources: withSources, newSource: newSource, STATUSES: STATUSES, LABELS: LABELS,
           withReadingCard: withReadingCard, cardFile: cardFile };
})();
</script>

<script id="coach">
/* The Reader's coach. Pure functions, no page access, so they can be tested on
   their own. The questions are fixed text: the coach only ever speaks after the
   student has answered (SPEC R11.2, R11.3). */
var Coach = (function () {
  var QUESTIONS = [
    { key: "What was measured", ask: "What did the study actually measure?",
      hint: "Look at the methods. Name the specific things the researchers counted, observed or asked about." },
    { key: "Who was studied", ask: "Who was studied, and how were they chosen?",
      hint: "Look for who took part, how many, where, and how they were picked." },
    { key: "What was found", ask: "What did the study find?",
      hint: "Look at the results. Say the main finding in your own words, with any key number." },
    { key: "What it doesn't show", ask: "What does this result not show?",
      hint: "Think about what someone might wrongly conclude from it." },
    { key: "Limits the authors admit", ask: "What limits do the authors admit?",
      hint: "Look for a limitations section or words like “however” and “cannot”." },
    { key: "How it relates to my question", ask: "How does this source relate to your research question?",
      hint: "Does it help answer your question? Does it support or complicate your position?", needsProject: true }
  ];

  function questionsFor(hasProject) {
    return QUESTIONS.filter(function (q) { return hasProject || !q.needsProject; });
  }

  var MAX_ARTICLE = 100000;

  var RULES = [
    "You are the reading coach inside Research Smarter, a tool that helps a student read one research article critically. The student does all the thinking and writing. Your job is to check their reading against the article and help them look more closely. You never do the reading for them.",
    "",
    "Rules:",
    "1. Never summarize, explain or paraphrase what the article says, about this question or any other. Never write an answer, a sentence or wording the student could copy into their notes.",
    "1a. Never mention anything in the article the student hasn't brought up themselves: no other outcomes, measures, numbers, groups or findings, not even as a hint (for example, don't say \"the study measured a second outcome\"). You may only point to where to look, such as a section name, and ask what they find there. When you praise an answer, describe only what the student wrote; don't add details from the article.",
    "2. If the student misstates a fact the article reports (a number, the sample, what was measured, or a finding), say plainly that this isn't what the article reports, and put the passage that shows the correct fact in \"quotes\". Then ask them to look at it again.",
    "3. If the student's answer is an interpretation the article doesn't support (for example treating a correlation as a cause, or generalizing beyond who was studied), do not tell them they are wrong and do not name a fallacy. Ask one question that leads them to check it themselves.",
    "4. If the student asks you to just tell them what the article says, summarize it, or answer for them, decline kindly. The reason is that the reading needs to be theirs. Never mention teachers, grades, cheating or getting caught. Offer the smallest next step, such as where in the article to look. Set \"kind\" to \"decline\".",
    "5. If the answer is accurate and answers the question, say briefly what is strong about it, and set \"ready\" to true. If something important is missing, ask about it without supplying it.",
    "6. Ask at most two questions in total: count every question mark. If you point to a place to look, make it part of one of those two questions, not an extra one. Keep \"reply\" under 90 words, warm and direct.",
    "7. Put article text only in \"quotes\", never in \"reply\". Each quote must be copied character for character from the article, at most 40 words, at most two quotes. If you can't quote exactly, leave \"quotes\" empty.",
    "",
    "Reply with only a JSON object, no other text:",
    "{\"reply\": string, \"quotes\": [string], \"kind\": \"correction\" | \"question\" | \"acknowledge\" | \"decline\", \"ready\": boolean}"
  ].join("\n");

  /* Builds the whole prompt for one coach turn. `turns` is this question's
     conversation so far: [{who: "student" | "coach", text}], ending with the
     student's newest message. */
  function buildInput(o) {
    var article = String(o.article || "").slice(0, MAX_ARTICLE);
    var parts = [RULES, "", "=== ARTICLE (" + (o.citation || "untitled") + ") ===", article, "=== END ARTICLE ===", ""];
    if (o.project && (o.project.question || o.project.position)) {
      parts.push("The student's research question, in their words: " + (o.project.question || "(not written yet)"));
      parts.push("The student's working position, in their words: " + (o.project.position || "(not written yet)"));
      parts.push("");
    }
    parts.push("The question the student is answering now: " + o.question);
    parts.push("");
    parts.push("Conversation about this question so far:");
    (o.turns || []).forEach(function (t) {
      parts.push((t.who === "coach" ? "Coach: " : "Student: ") + t.text);
    });
    parts.push("");
    parts.push("Write the coach's next reply as the JSON object described above.");
    return parts.join("\n");
  }

  function squash(s) {
    return String(s || "").replace(/[‘’]/g, "'").replace(/[“”]/g, "\"")
      .replace(/[‐-―]/g, "-").replace(/\s+/g, " ").trim().toLowerCase();
  }

  /* Keeps only quotes that appear in the article (ignoring spacing, line breaks,
     curly vs straight quotes and dash styles). SPEC R11.7. */
  function verifyQuotes(article, quotes) {
    var hay = squash(article), ok = [], dropped = 0;
    (Array.isArray(quotes) ? quotes : []).forEach(function (q) {
      var t = String(q || "").trim().replace(/^["“]|["”]$/g, "").trim();
      if (t.length >= 8 && hay.indexOf(squash(t)) >= 0) ok.push(t); else if (t) dropped++;
    });
    return { quotes: ok.slice(0, 2), dropped: dropped };
  }

  /* Turns the model's answer into something safe to show. */
  function clean(res, article) {
    var r = res && typeof res === "object" ? res : {};
    var v = verifyQuotes(article, r.quotes);
    var kinds = ["correction", "question", "acknowledge", "decline"];
    return {
      reply: String(r.reply || "").trim(),
      quotes: v.quotes,
      dropped: v.dropped,
      kind: kinds.indexOf(r.kind) >= 0 ? r.kind : "question",
      ready: r.ready === true
    };
  }

  return { QUESTIONS: QUESTIONS, questionsFor: questionsFor, buildInput: buildInput,
           verifyQuotes: verifyQuotes, clean: clean, MAX_ARTICLE: MAX_ARTICLE };
})();
</script>

<script>
(function () {
  var $ = function (id) { return document.getElementById(id); };
  var PHASES = ["Intake", "Explore", "Stress test", "Plan", "Research", "Ongoing (optional)"];

  var EXAMPLE = [
    "# Research Smarter · Research log", "",
    "**Last updated:** 2026-11-10", "",
    "## Where I am", "",
    "- **Current phase and step:** Phase 4, reflecting (last step)",
    "- **Exit checks passed:** Phase 0, Phase 1, Phase 2, Phase 3",
    "- **What I was in the middle of:** finished the reflection questions; ready to wrap up research", "",
    "## Assignment (from intake)", "",
    "- **Assignment:** argumentative essay, 8 pages",
    "- **Discipline:** sociology",
    "- **Source requirements and citation style:** at least 5 peer-reviewed sources, APA",
    "- **Research type and working position:** argumentative essay, thesis",
    "- **Challenge level:** moderate", "",
    "## My research question and position (in my own words)", "",
    "- **Research question:** \"How have school-day phone bans changed how high school students interact with each other in person?\"",
    "- **Working position:** \"Phone bans increase face-to-face interaction during the school day, but they don't reduce social conflict, they just move it to after school.\"",
    "- **Strongest counterargument and my response:** \"Students might just be talking more because they're bored, not because they're connecting. I'd answer that even bored conversation builds social skills.\"", "",
    "## Sources found so far", "",
    "| Citation | Link or DOI | Sub-question | Supports or complicates | Verified? | Reading status |",
    "|---|---|---|---|---|---|",
    "| Example study of a school phone policy (2025) | | Do students talk more in person? | supports | yes | read closely |",
    "| Example survey of after-school online conflict (2024) | | Does conflict move online? | complicates | yes | skimmed |",
    "| Example news report on a district's phone ban (2025) | | Do students talk more in person? | | | found |", "",
    "## Key decisions and changes of direction", "",
    "- 2026-10-20 Narrowed from \"do bans work\" to social interaction.", ""
  ].join("\n");

  var state = { markdown: null, parsed: null, isExample: false, view: "research", readIndex: null, returnTo: "sources" };
  var cap = { db: null, user: null, uid: null, dl: null, sample: null,
              sampleWhy: (window.claude && window.claude.use) ? "checking" : "no_claude" };

  function status(text, kind) {
    var s = $("status");
    if (!text) { s.hidden = true; return; }
    s.className = "notice" + (kind ? " " + kind : ""); s.textContent = text; s.hidden = false;
  }
  function el(tag, cls, text) { var e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; }

  /* A real <label for="file"> opens the file picker on the student's own click.
     Opening it from script (input.click()) can be blocked inside Claude's page frame. */
  function fileButton(text, primary) {
    var l = el("label", "button" + (primary ? " primary" : ""), text);
    l.htmlFor = "file"; l.tabIndex = 0; l.setAttribute("role", "button");
    l.addEventListener("click", function () { $("file").value = ""; });
    l.addEventListener("keydown", function (e) {
      if (e.key === "Enter" || e.key === " ") { e.preventDefault(); $("file").value = ""; $("file").click(); }
    });
    return l;
  }

  function linkFor(v) {
    var t = (v || "").trim();
    if (/^https?:\/\//i.test(t)) return t;
    var doi = /^(?:doi:\s*)?(10\.\d{4,9}\/\S+)$/i.exec(t);
    return doi ? "https://doi.org/" + doi[1] : null;
  }

  /* ---------- Views ---------- */

  /* ---------- Routing: #research, #sources, #read ---------- */

  /* The page's own state decides the view. The address (#sources) is only kept in
     step where the viewer allows it, so a blocked address change never stops a click. */
  var VIEWS = ["research", "sources", "read"];
  document.querySelectorAll("#tabs a[data-view]").forEach(function (a) {
    a.addEventListener("click", function (e) { e.preventDefault(); go(a.getAttribute("data-view")); });
  });
  function go(view) {
    state.view = VIEWS.indexOf(view) >= 0 ? view : "research";
    render();
    try {
      if (location.protocol !== "data:" && location.hash !== "#" + state.view) {
        history.replaceState(null, "", "#" + state.view);
      }
    } catch (e) { /* address unchanged; the view still switched */ }
    window.scrollTo(0, 0);
  }
  window.addEventListener("hashchange", function () {
    var h = (location.hash || "").slice(1);
    if (VIEWS.indexOf(h) >= 0 && h !== state.view) { state.view = h; render(); }
  });
  (function () { var h = (location.hash || "").slice(1); if (h === "sources") state.view = h; })();

  function render() {
    if (state.view === "read" && !state.reader) state.view = state.parsed ? "sources" : "research";
    if (!state.parsed) {
      $("tabs").hidden = true;
      if (state.view === "read") renderRead(); else renderEmpty();
      return;
    }
    $("tabs").hidden = false;
    ["research", "sources"].forEach(function (n) {
      var t = $("tab-" + n);
      if (n === state.view || (n === "sources" && state.view === "read")) t.setAttribute("aria-current", "page");
      else t.removeAttribute("aria-current");
    });
    $("tab-sources").textContent = "Sources (" + state.parsed.sources.length + ")";
    if (state.view === "sources") renderSources();
    else if (state.view === "read") renderRead();
    else renderProject();
  }

  function renderEmpty() {
    $("actions").hidden = true;
    $("tabs").hidden = true;
    var v = $("view"); v.textContent = "";
    var box = el("section", "panel empty");
    box.append(el("p", "eyebrow", "Your notebook"));
    box.append(el("h2", null, "Bring in your research log"));
    box.append(el("p", "muted", "Load the research log Research Smarter gave you, and your question, position, phase and sources appear here. Your log stays in your words, exactly as you wrote it."));
    var choices = el("div", "choices");
    var bFile = fileButton("Load a log file", true);
    var bPaste = el("button", null, "Paste log text"); bPaste.type = "button"; bPaste.onclick = showPaste;
    var bEx = el("button", null, "See an example"); bEx.type = "button"; bEx.onclick = function () { load(EXAMPLE, { example: true }); };
    choices.append(bFile, bPaste, bEx);
    box.append(choices);
    box.append(el("p", "muted", "No log yet? Start a project with the Research Smarter skill by saying “I want to research…”, and ask it for your research log when you stop."));
    v.append(box);
  }

  function showPaste() {
    var v = $("view"); v.textContent = "";
    var box = el("section", "panel");
    box.append(el("h2", null, "Paste your research log"));
    var ta = el("textarea"); ta.id = "paste-text"; ta.setAttribute("aria-label", "Research log text");
    ta.placeholder = "# Research Smarter · Research log\n\n**Last updated:** …";
    var row = el("div", "choices");
    var bLoad = el("button", "primary", "Load this text"); bLoad.type = "button";
    bLoad.onclick = function () { if (!ta.value.trim()) { status("Paste your log text first.", "warn"); return; } load(ta.value, { name: "pasted text" }); };
    var bBack = el("button", null, "Cancel"); bBack.type = "button"; bBack.onclick = function () { status(""); render(); };
    row.append(bLoad, bBack);
    box.append(ta, row);
    v.append(box);
    ta.focus();
  }

  function words(label, item, emptyText) {
    var wrap = el("div"); wrap.style.display = "grid"; wrap.style.gap = "6px";
    wrap.append(el("p", "label", label));
    var q = el("blockquote", "words" + (item.written ? "" : " empty"), item.written ? item.text : emptyText);
    wrap.append(q);
    return wrap;
  }

  function renderProject() {
    var P = state.parsed, v = $("view"); v.textContent = "";
    $("actions").hidden = false;

    if (state.isExample) {
      var n = el("div", "notice warn", "You're looking at an example project, not your own. Load your research log to start.");
      v.append(n);
    }

    // Where I am
    var where = el("section", "panel");
    where.append(el("p", "eyebrow", "Where I am"));
    where.append(el("h2", null, P.phase.text || "Phase not recorded"));
    var track = el("ol", "track"); track.setAttribute("aria-label", "Research Smarter phases");
    PHASES.forEach(function (name, i) {
      var li = el("li"); var label = el("span");
      label.append(el("span", "num", String(i)), el("span", "name", " · " + name));
      li.title = "Phase " + i + " · " + name;
      var done = P.phase.exitChecks.indexOf(i) >= 0 || (P.phase.complete && P.phase.number === i);
      var current = P.phase.current === i;
      if (done) li.className = "done"; else if (current) li.className = "current";
      li.append(label);
      if (current) li.setAttribute("aria-current", "step");
      track.append(li);
    });
    where.append(track);
    if (P.phase.middle) where.append(el("p", null, "In the middle of: " + P.phase.middle));
    if (P.lastUpdated) where.append(el("p", "muted", "Log last updated " + P.lastUpdated));
    v.append(where);

    // In my own words
    var mine = el("section", "panel");
    mine.append(el("p", "eyebrow", "In my own words"));
    mine.append(words("Research question", P.question, "Not written yet. You'll write it in Phase 1."));
    mine.append(words("Working position", P.position, "Not written yet. You'll form it in Phase 2."));
    mine.append(words("Strongest counterargument and my response", P.counter, "Not written yet."));
    v.append(mine);

    // Assignment
    var a = P.assignment;
    var asg = el("section", "panel");
    asg.append(el("p", "eyebrow", "Assignment"));
    var dl = el("dl", "meta");
    [["Assignment", a.assignment], ["Discipline", a.discipline], ["Sources and citation style", a.sources],
     ["Research type", a.researchType], ["Challenge level", a.challenge]].forEach(function (pair) {
      if (!pair[1]) return;
      var d = el("div"); d.append(el("dt", null, pair[0]), el("dd", null, pair[1])); dl.append(d);
    });
    asg.append(dl);
    v.append(asg);

    // Sources summary
    var src = el("section", "panel");
    src.append(el("p", "eyebrow", "Sources"));
    if (!P.sources.length) {
      src.append(el("p", "muted", "No sources yet. They'll come from Phase 4, or you can add one yourself."));
    } else {
      src.append(el("h3", null, P.sources.length + (P.sources.length === 1 ? " source" : " sources")));
      src.append(summaryChips(P.sources));
    }
    var open = el("button", null, P.sources.length ? "Open my sources" : "Add a source"); open.type = "button";
    open.onclick = function () { go("sources"); };
    var row = el("div", "row-actions"); row.append(open); src.append(row);
    v.append(src);

    // Decisions
    if (P.decisions.length) {
      var dec = el("section", "panel");
      dec.append(el("p", "eyebrow", "Key decisions"));
      var dul = el("ul", "plain");
      P.decisions.forEach(function (d) { dul.append(el("li", null, d)); });
      dec.append(dul);
      v.append(dec);
    }
  }

  function summaryChips(sources) {
    var wrap = el("div", "summary");
    LogFormat.STATUSES.forEach(function (st) {
      var n = sources.filter(function (s) { return s.status === st; }).length;
      if (n) wrap.append(el("span", "count", n + " " + st));
    });
    var nr = sources.filter(function (s) { return LogFormat.STATUSES.indexOf(s.status) < 0; }).length;
    if (nr) wrap.append(el("span", "count", nr + " reading status not recorded"));
    var unl = sources.filter(function (s) { return !s.label; }).length;
    if (unl) wrap.append(el("span", "count unlabeled", unl + " not labeled yet"));
    return wrap;
  }

  var LABEL_TEXT = { "": "Not labeled yet", supports: "Supports my position", complicates: "Complicates my position" };

  function renderSources() {
    var P = state.parsed, v = $("view"); v.textContent = "";
    $("actions").hidden = false;
    if (state.isExample) v.append(el("div", "notice warn", "You're looking at an example project. Changes here aren't kept."));

    var head = el("section", "panel");
    head.append(el("p", "eyebrow", "Sources"));
    head.append(el("h2", null, P.sources.length ? "Your sources" : "No sources yet"));
    head.append(el("p", "muted", "Mark how far you've read each one, and decide for yourself whether it supports or complicates your position. The notebook never decides that for you."));
    if (P.sources.length) head.append(summaryChips(P.sources));
    v.append(head);

    var list = el("section", "panel");
    list.setAttribute("aria-label", "Source list");
    P.sources.forEach(function (s, i) { list.append(sourceCard(s, i)); });
    if (!P.sources.length) list.append(el("p", "muted", "Add a source below, or bring in a log from Phase 4."));
    v.append(list);

    v.append(addForm());
  }

  function sourceCard(s, i) {
    var card = el("article", "src-card");
    card.append(el("p", "cite", s.citation || "(no citation)"));
    var href = linkFor(s.link);
    if (href) { var a = el("a", null, s.link); a.href = href; a.target = "_blank"; a.rel = "noopener"; card.append(a); }
    else if (s.link) card.append(el("p", "muted", s.link));
    var tags = el("div", "tags");
    if (s.subq) tags.append(el("span", "tag", s.subq));
    if (s.verified) tags.append(el("span", "tag", "verified: " + s.verified));
    if (tags.childNodes.length) card.append(tags);

    var controls = el("div", "controls");
    var lStatus = el("label", null, "How far I've read it");
    var selS = el("select"); selS.id = "status-" + i;
    if (LogFormat.STATUSES.indexOf(s.status) < 0) {
      var o0 = el("option", null, s.status ? "From your log: " + s.status : "Not recorded"); o0.value = s.status; selS.append(o0);
    }
    LogFormat.STATUSES.forEach(function (st) { var o = el("option", null, st.charAt(0).toUpperCase() + st.slice(1)); o.value = st; selS.append(o); });
    selS.value = s.status;
    selS.onchange = function () { updateSource(i, { status: selS.value }, "Marked as " + selS.value + "."); };
    lStatus.append(selS);

    var lLabel = el("label", null, "Supports or complicates my position");
    var selL = el("select"); selL.id = "label-" + i;
    ["", "supports", "complicates"].forEach(function (k) { var o = el("option", null, LABEL_TEXT[k]); o.value = k; selL.append(o); });
    if (s.label && LogFormat.LABELS.indexOf(s.label.toLowerCase()) < 0) {
      var o = el("option", null, "From your log: " + s.label); o.value = s.label; selL.append(o);
    }
    selL.value = LogFormat.LABELS.indexOf(s.label.toLowerCase()) >= 0 ? s.label.toLowerCase() : s.label;
    if (!s.label) selL.classList.add("unlabeled");
    selL.onchange = function () {
      selL.classList.toggle("unlabeled", !selL.value);
      updateSource(i, { label: selL.value }, selL.value ? "Labeled: " + LABEL_TEXT[selL.value].toLowerCase() + "." : "Label cleared.");
    };
    lLabel.append(selL);
    controls.append(lStatus, lLabel);
    card.append(controls);

    var actions = el("div", "row-actions");
    var read = el("button", "primary", "Read this source"); read.type = "button";
    read.onclick = function () { openReader(i, "sources"); };
    var rm = el("button", null, "Remove"); rm.type = "button";
    rm.onclick = function () {
      actions.textContent = "";
      actions.append(el("span", null, "Remove this source from your notebook?"));
      var yes = el("button", null, "Remove it"); yes.type = "button";
      yes.onclick = function () {
        var list = state.parsed.sources.slice(); list.splice(i, 1);
        applySources(list, "Removed. It's gone from your notebook, but not from any log you saved before.");
        renderSources();
      };
      var no = el("button", null, "Keep it"); no.type = "button"; no.onclick = renderSources;
      actions.append(yes, no); no.focus();
    };
    actions.append(read, rm);
    card.append(actions);
    return card;
  }

  function addForm() {
    var box = el("section", "panel");
    box.append(el("h3", null, "Add a source"));
    var form = el("form", "form"); form.noValidate = true;
    function input(id, label, placeholder) {
      var l = el("label", null, label); var i = el("input"); i.type = "text"; i.id = id; i.placeholder = placeholder || "";
      l.append(i); return { label: l, input: i };
    }
    var c = input("add-citation", "Citation", "Author, year, title");
    var k = input("add-link", "Link or DOI (optional)", "https://… or 10.xxxx/…");
    var q = input("add-subq", "Sub-question it helps with (optional)", "");
    var subqs = state.parsed.plan.map(function (r) { return r["Sub-question (my words)"] || r["Sub-question"] || ""; }).filter(Boolean);
    if (subqs.length) {
      var dl = el("datalist"); dl.id = "subq-list";
      subqs.forEach(function (t) { var o = el("option"); o.value = t; dl.append(o); });
      q.input.setAttribute("list", "subq-list"); box.append(dl);
    }
    var submit = el("button", "primary", "Add source"); submit.type = "submit";
    form.append(c.label, k.label, q.label, submit);
    form.addEventListener("submit", function (e) {
      e.preventDefault();
      if (!c.input.value.trim()) { status("Add a citation first, so you'll know which source this is.", "warn"); c.input.focus(); return; }
      var list = state.parsed.sources.concat([LogFormat.newSource({ citation: c.input.value, link: k.input.value, subq: q.input.value })]);
      applySources(list, "Added. Decide whether it supports or complicates your position once you've read it.");
      renderSources();
      var cards = document.querySelectorAll(".src-card");
      if (cards.length) cards[cards.length - 1].scrollIntoView({ block: "nearest" });
    });
    box.append(form);
    return box;
  }

  /* ================= Read a Source (the Reader) ================= */

  var VIEW_NAMES = { research: "My Research", sources: "my sources", empty: "the start page" };

  function openReader(index, returnTo) {
    var P = state.parsed;
    var src = P && index != null ? P.sources[index] : null;
    state.readIndex = index;
    state.returnTo = returnTo;
    state.reader = {
      index: index, citation: src ? src.citation : "", article: null,
      qs: Coach.questionsFor(!!P),
      step: 0, threads: [], answers: [], finished: false, saved: false, busy: false
    };
    go("read");
  }

  function leaveReader() {
    var R = state.reader;
    var unsaved = R && !R.saved && R.answers.some(function (a) { return a && a.trim(); });
    var target = state.returnTo === "empty" || !state.parsed ? "research" : state.returnTo;
    if (!unsaved) { state.reader = null; state.readIndex = null; go(target); return; }
    var v = $("view");
    var box = el("section", "panel confirm");
    box.append(el("h2", null, "Leave this reading?"));
    box.append(el("p", null, "Your answers so far aren't saved yet. If you leave now, they're gone. Finish the reading to save your card."));
    var row = el("div", "choices");
    var stay = el("button", "primary", "Keep reading"); stay.type = "button"; stay.onclick = renderRead;
    var leave = el("button", null, "Leave without saving"); leave.type = "button";
    leave.onclick = function () { state.reader = null; state.readIndex = null; go(target); };
    row.append(stay, leave); box.append(row);
    v.prepend(box); stay.focus(); window.scrollTo(0, 0);
  }

  function backButton() {
    var b = el("button", null, "Back to " + (VIEW_NAMES[state.parsed ? state.returnTo : "empty"] || "my sources")); b.type = "button";
    b.onclick = leaveReader;
    return b;
  }

  function renderRead() {
    var R = state.reader;
    if (!R) { go(state.parsed ? "sources" : "research"); return; }
    $("actions").hidden = !state.parsed;
    if (!R.article) renderReaderLoad();
    else if (R.finished) renderReaderCard();
    else renderReaderStep();
  }

  /* --- Stage 1: bring in the article --- */
  function renderReaderLoad() {
    var R = state.reader, v = $("view"); v.textContent = "";
    var box = el("section", "panel");
    box.append(el("p", "eyebrow", "Read a Source"));
    box.append(el("h2", null, R.citation || "Read an article closely"));
    box.append(el("p", "muted", "A coach will ask you " + R.qs.length + " questions, one at a time, and check your answers against the article. It won't explain the article for you. Your answers become a reading card in your words."));
    if (!R.citation) {
      var l = el("label", null, "What are you reading? (citation or title)");
      l.className = "label"; l.style.display = "grid"; l.style.gap = "4px";
      var c = el("input"); c.type = "text"; c.id = "read-citation"; c.placeholder = "Author, year, title";
      c.oninput = function () { R.citation = c.value; };
      l.append(c); box.append(l);
    }
    box.append(el("p", "label", "Bring in the article's text"));
    var ta = el("textarea"); ta.id = "article-text"; ta.setAttribute("aria-label", "Article text");
    ta.placeholder = "Paste the article's text here.";
    var row = el("div", "choices");
    var use = el("button", "primary", "Use this text"); use.type = "button";
    use.onclick = function () {
      if (!R.citation.trim()) { status("Add what you're reading first, so your card is labeled.", "warn"); var ci = $("read-citation"); if (ci) ci.focus(); return; }
      setArticle(ta.value, "pasted text");
    };
    var pdf = el("label", "button", "Open a PDF");
    pdf.htmlFor = "pdf"; pdf.tabIndex = 0; pdf.setAttribute("role", "button");
    pdf.addEventListener("click", function (e) {
      if (!R.citation.trim()) { e.preventDefault(); status("Add what you're reading first, so your card is labeled.", "warn"); var ci = $("read-citation"); if (ci) ci.focus(); return; }
      $("pdf").value = "";
    });
    pdf.addEventListener("keydown", function (e) { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); pdf.click(); } });
    row.append(use, pdf, backButton());
    box.append(ta, row);
    box.append(el("p", "muted", "The article stays on this device while you read. It's never saved or shared; only your answers and short quotes are kept."));
    v.append(box);
  }

  function setArticle(text, name) {
    var R = state.reader, t = String(text || "").replace(/\r\n?/g, "\n").trim();
    if (t.length < 400) { status("That's too short to be an article. Paste the full text, or open the PDF.", "warn"); return; }
    R.article = { text: t.slice(0, Coach.MAX_ARTICLE), name: name, truncated: t.length > Coach.MAX_ARTICLE };
    R.threads = R.qs.map(function () { return []; });
    R.answers = R.qs.map(function () { return ""; });
    status(R.article.truncated ? "Loaded. The article is very long, so the coach sees about the first 100,000 characters." : "Loaded. Start with question 1.", R.article.truncated ? "warn" : "ok");
    renderRead();
  }

  var PDFJS = "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/";
  function loadScript(src) {
    return new Promise(function (res, rej) {
      var s = document.createElement("script"); s.src = src; s.onload = res; s.onerror = rej; document.head.append(s);
    });
  }
  var pdfReady = null;
  function pdfLib() {
    if (!pdfReady) {
      /* Loading the worker script first lets pdf.js run on the page itself,
         since a separate worker can't load inside Claude's page frame. */
      pdfReady = loadScript(PDFJS + "pdf.worker.min.js").then(function () { return loadScript(PDFJS + "pdf.min.js"); })
        .then(function () { window.pdfjsLib.GlobalWorkerOptions.workerSrc = PDFJS + "pdf.worker.min.js"; return window.pdfjsLib; });
      pdfReady.catch(function () { pdfReady = null; });
    }
    return pdfReady;
  }

  $("pdf").addEventListener("change", function () {
    var f = this.files && this.files[0];
    if (!f) return;
    if (/\.txt$/i.test(f.name) || f.type === "text/plain") {
      var tr = new FileReader(); tr.onload = function () { setArticle(String(tr.result), f.name); }; tr.readAsText(f); return;
    }
    status("Reading the PDF…");
    var fr = new FileReader();
    fr.onload = function () {
      pdfLib().then(function (lib) {
        return lib.getDocument({ data: new Uint8Array(fr.result) }).promise;
      }).then(function (doc) {
        var pages = [];
        var chain = Promise.resolve();
        for (var i = 1; i <= doc.numPages; i++) {
          (function (n) {
            chain = chain.then(function () { return doc.getPage(n); }).then(function (p) { return p.getTextContent(); })
              .then(function (tc) { pages.push(tc.items.map(function (it) { return it.str + (it.hasEOL ? "\n" : " "); }).join("")); });
          })(i);
        }
        return chain.then(function () { return { text: pages.join("\n\n"), n: doc.numPages }; });
      }).then(function (r) {
        var chars = r.text.replace(/\s+/g, "").length;
        if (chars < 200 * Math.min(r.n, 3)) {
          status("This PDF has almost no text to read. It may be a scanned image. Paste the article's text instead.", "bad");
          return;
        }
        setArticle(r.text, f.name);
      }).catch(function () {
        status("That PDF couldn't be opened here. Paste the article's text instead.", "bad");
      });
    };
    fr.readAsArrayBuffer(f);
  });

  /* --- Stage 2: one question at a time --- */
  function renderReaderStep() {
    var R = state.reader, v = $("view"); v.textContent = "";
    var q = R.qs[R.step];
    var top = el("section", "panel");
    top.append(el("p", "eyebrow", "Read a Source · " + (R.citation || "your article")));
    var steps = el("ol", "steps"); steps.setAttribute("aria-label", "Questions");
    R.qs.forEach(function (_, i) {
      var li = el("li", i < R.step ? "done" : (i === R.step ? "current" : ""), String(i + 1));
      if (i === R.step) li.setAttribute("aria-current", "step");
      steps.append(li);
    });
    top.append(steps);
    var det = el("details"); det.open = true;
    det.append(el("summary", "label", "The article"));
    var art = el("div", "article", R.article.text); art.tabIndex = 0; art.setAttribute("aria-label", "Article text");
    det.append(art);
    top.append(det);
    v.append(top);

    var work = el("section", "panel");
    work.append(el("p", "label", "Question " + (R.step + 1) + " of " + R.qs.length));
    work.append(el("p", "ask", q.ask));
    work.append(el("p", "muted", q.hint));
    var thread = el("div", "thread"); thread.setAttribute("aria-live", "polite");
    R.threads[R.step].forEach(function (t) { thread.append(message(t)); });
    work.append(thread);

    var ta = el("textarea", "answer"); ta.id = "answer-" + R.step; ta.setAttribute("aria-label", "Your answer");
    ta.placeholder = R.threads[R.step].length ? "Revise your answer, or reply to the coach." : "Your answer, in your own words.";
    var row = el("div", "choices");
    var send = el("button", "primary", cap.sample ? "Send to coach" : "Save my answer"); send.type = "button";
    var next = el("button", null, R.step === R.qs.length - 1 ? "Finish and see my card" : "Next question"); next.type = "button";
    next.disabled = !R.answers[R.step].trim();
    send.onclick = function () { submitAnswer(ta.value); };
    next.onclick = function () {
      if (R.step < R.qs.length - 1) { R.step++; status(""); renderRead(); window.scrollTo(0, 0); }
      else { R.finished = true; status(""); renderRead(); window.scrollTo(0, 0); }
    };
    row.append(send, next, backButton());
    work.append(ta, row);
    if (!cap.sample) work.append(el("div", "notice warn", coachUnavailableText()));
    v.append(work);
  }

  /* Says why the coach isn't running and what the student can do about it. */
  function coachUnavailableText() {
    var why = {
      checking: "The coach is still connecting. Wait a moment, then send your answer.",
      no_claude: "Open this notebook in Claude to use the coach. Here, your answers are saved without feedback.",
      not_available: "The coach couldn't connect in this window. Close the notebook completely and open its link again. If it still doesn't connect, Claude access may be turned off for you or your organization. Until then, your answers are saved without feedback.",
      not_granted: "The coach needs your permission to use Claude, and it wasn't given. Close the notebook, open it again, and choose Allow when Claude asks. Until then, your answers are saved without feedback.",
      disabled: "Claude isn't available for your account here, so the coach can't run. Your answers are saved without feedback."
    };
    return why[cap.sampleWhy] || why.not_available;
  }

  function message(t) {
    var m = el("div", "msg " + t.who);
    m.append(el("span", "who", t.who === "coach" ? "Coach" : "You"));
    m.append(el("div", null, t.text));
    (t.quotes || []).forEach(function (q) { m.append(el("blockquote", null, "“" + q + "”")); });
    if (t.dropped) m.append(el("p", "muted", "(The coach pointed to a passage that isn't in the article word for word, so it isn't shown.)"));
    return m;
  }

  function submitAnswer(text) {
    var R = state.reader, t = String(text || "").trim();
    if (!t) { status("Write your answer first.", "warn"); return; }
    if (R.busy) return;
    if (!cap.sample && cap.sampleWhy === "checking") { status("The coach is still connecting. Send your answer again in a moment.", "warn"); return; }
    var thread = R.threads[R.step];
    thread.push({ who: "student", text: t });
    var lower = t.toLowerCase();
    var looksLikeRequest = /^(just |can you |could you |please )?(tell me|summari[sz]e|explain|what does it say)/.test(lower);
    if (!looksLikeRequest) R.answers[R.step] = t;
    if (!cap.sample) { renderRead(); status("Saved your answer.", "ok"); return; }
    R.busy = true;
    renderRead();
    status("The coach is reading your answer…");
    var input = Coach.buildInput({
      article: R.article.text, citation: R.citation, question: R.qs[R.step].ask,
      project: state.parsed ? {
        question: state.parsed.question.written ? state.parsed.question.text : "",
        position: state.parsed.position.written ? state.parsed.position.text : ""
      } : null,
      turns: thread
    });
    cap.sample.json(input, { cache: false }).then(function (res) {
      var c = Coach.clean(res, R.article.text);
      if (!c.reply) throw { code: "empty_completion" };
      thread.push({ who: "coach", text: c.reply, quotes: c.quotes, dropped: c.dropped, kind: c.kind });
      status("");
    }).catch(function (e) {
      var code = e && e.code;
      var msg = code === "not_granted" ? "The coach needs your permission to use Claude. Your answer is saved; you can keep going without feedback." :
        code === "rate_limited" ? "The coach is busy right now. Your answer is saved; try sending again in a minute." :
        "The coach couldn't reply (" + (code || "error") + "). Your answer is saved; you can try again.";
      if (code === "not_granted" || code === "sampling_disabled") {
        cap.sample = null; cap.sampleWhy = code === "not_granted" ? "not_granted" : "disabled";
      }
      status(msg, "warn");
    }).finally(function () { R.busy = false; renderRead(); });
  }

  /* --- Stage 3: the reading card --- */
  function cardData() {
    var R = state.reader;
    return {
      citation: R.citation || "Untitled source", date: LogFormat.localDate(),
      answers: R.qs.map(function (q, i) { return { label: q.key, answer: R.answers[i] || "(no answer)" }; })
    };
  }

  function renderReaderCard() {
    var R = state.reader, v = $("view"); v.textContent = "";
    var card = cardData();
    var box = el("section", "panel");
    box.append(el("p", "eyebrow", "Reading card"));
    box.append(el("h2", null, "What this source can and can't tell me"));
    box.append(el("p", "muted", card.citation + " · read on " + card.date));
    var dl = el("dl", "card-qa");
    card.answers.forEach(function (a) {
      var d = el("div"); d.append(el("dt", null, a.label), el("dd", null, a.answer)); dl.append(d);
    });
    box.append(dl);
    var row = el("div", "choices");
    if (state.parsed && !state.isExample) {
      var save = el("button", "primary", R.saved ? "Saved to your notebook" : "Save to my notebook"); save.type = "button";
      save.disabled = R.saved;
      save.onclick = function () {
        /* Only call it saved once storage confirms. If the save fails, put the
           notebook back as it was, so trying again can't add the card twice. */
        var before = { markdown: state.markdown, parsed: state.parsed };
        var md = LogFormat.withReadingCard(state.markdown, card);
        state.markdown = md; state.parsed = LogFormat.parse(md);
        if (R.index != null && state.parsed.sources[R.index]) {
          var list = state.parsed.sources.map(function (s, j) {
            if (j !== R.index) return s;
            var c = {}; Object.keys(s).forEach(function (k) { c[k] = s[k]; }); c.status = "read closely"; return c;
          });
          state.markdown = LogFormat.withSources(state.markdown, list, state.parsed.sourcesHeader);
          state.parsed = LogFormat.parse(state.markdown);
        }
        save.disabled = true; save.textContent = "Saving…";
        persist("Saved your reading card" + (R.index != null ? " and marked the source as read closely." : ".")).then(function (ok) {
          if (ok) { R.saved = true; }
          else { state.markdown = before.markdown; state.parsed = before.parsed; }
          renderRead();
        });
      };
      row.append(save);
    } else {
      var file = el("button", "primary", "Save card as a file"); file.type = "button";
      file.onclick = function () {
        var text = LogFormat.cardFile(card), name = "reading-card-" + card.date + ".md";
        if (!cap.dl) { showCopy(text, name); return; }
        cap.dl.save({ filename: name, data: text }).then(function () { R.saved = true; status("Saved " + name + ".", "ok"); renderRead(); })
          .catch(function (e) { if (e && e.code === "declined") status("Save cancelled.", "warn"); else showCopy(text, name); });
      };
      row.append(file);
      if (state.isExample) box.append(el("p", "muted", "This is the example project, so the card isn't added to a notebook."));
    }
    var edit = el("button", null, "Go back and revise"); edit.type = "button";
    edit.onclick = function () { R.finished = false; R.step = R.qs.length - 1; renderRead(); };
    if (!R.saved) row.append(edit);
    row.append(backButton());
    box.append(row);
    v.append(box);
  }

  function updateSource(i, changes, message) {
    var list = state.parsed.sources.map(function (s, j) {
      if (j !== i) return s;
      var c = {}; Object.keys(s).forEach(function (k) { c[k] = s[k]; });
      Object.keys(changes).forEach(function (k) { c[k] = changes[k]; });
      return c;
    });
    applySources(list, message);
    $("tab-sources").textContent = "Sources (" + state.parsed.sources.length + ")";
    var sum = document.querySelector("#view .summary");
    if (sum) sum.replaceWith(summaryChips(state.parsed.sources));
  }

  function applySources(list, message) {
    state.markdown = LogFormat.withSources(state.markdown, list, state.parsed.sourcesHeader);
    state.parsed = LogFormat.parse(state.markdown);
    $("tab-sources").textContent = "Sources (" + state.parsed.sources.length + ")";
    if (state.isExample) { status(message + " (Example only, not kept.)", "warn"); return; }
    persist(message);
  }

  /* ---------- Loading ---------- */

  $("file").addEventListener("change", function () {
    var f = this.files && this.files[0];
    if (!f) return;
    if (f.size > 200000) { status("That file is too large to be a research log.", "bad"); return; }
    var r = new FileReader();
    r.onload = function () { load(String(r.result), { name: f.name }); };
    r.onerror = function () { status("That file couldn't be read. Try pasting its text instead.", "bad"); };
    r.readAsText(f);
  });

  function load(text, opts) {
    opts = opts || {};
    var parsed = LogFormat.parse(text);
    if (!parsed.ok) {
      status("That doesn't look like a Research Smarter research log, so nothing was changed. A log starts with “# Research Smarter · Research log”.", "bad");
      return;
    }
    state.markdown = String(text).replace(/\r\n?/g, "\n");
    state.parsed = parsed;
    state.isExample = !!opts.example;
    state.readIndex = null;
    go("research");
    if (opts.example) { status(""); return; }
    persist("Loaded " + (opts.name || "your log") + ".");
  }

  /* One write at a time: a change made while a save is running is saved right after it. */
  /* Writes go out one at a time, in order, each with the newest notebook. A write
     that gets no answer within 15 seconds counts as failed, so it can't silently
     hold up later saves. Resolves true only when storage confirmed the write. */
  var queue = Promise.resolve();
  function writeNow() {
    var doc = cap.db.doc("data/users/" + cap.uid + "/project");
    var write = doc.set({ markdown: state.markdown, savedOn: LogFormat.localDate() });
    var timeout = new Promise(function (_, rej) { setTimeout(function () { rej({ code: "no_answer" }); }, 15000); });
    return Promise.race([write, timeout]).then(function () { return { ok: true }; }, function (e) { return { ok: false, code: (e && e.code) || "error" }; });
  }
  function persist(message) {
    if (!cap.db || !cap.uid) {
      status(message + " This view can't keep your notebook between visits, so save your research log before you leave.", "warn");
      return Promise.resolve(false);
    }
    var p = queue.then(writeNow).then(function (r) {
      if (r.ok) status(message, "ok");
      else status("Your notebook couldn't be saved (" + r.code + "). Your change is still on this page. Try again, or save your research log as a file.", "bad");
      return r.ok;
    });
    queue = p.then(function () {}, function () {});
    return p;
  }

  /* ---------- Replace with confirm ---------- */

  $("btn-replace").onclick = function () {
    if (state.isExample) { renderEmpty(); status(""); return; }
    var v = $("view");
    var box = el("section", "panel confirm");
    box.append(el("h2", null, "Load a different log?"));
    box.append(el("p", null, "This replaces the project in your notebook. Your log files aren't changed. Save your current log first if you've changed anything here."));
    var row = el("div", "choices");
    var go = fileButton("Choose a log file", true);
    var paste = el("button", null, "Paste log text"); paste.type = "button"; paste.onclick = showPaste;
    var no = el("button", null, "Cancel"); no.type = "button"; no.onclick = render;
    row.append(go, paste, no); box.append(row);
    v.prepend(box);
    go.focus();
  };

  /* ---------- Saving ---------- */

  $("btn-save").onclick = function () {
    if (!state.markdown) return;
    var date = LogFormat.localDate();
    var text = LogFormat.save(state.markdown, date);
    var name = "research-log-" + date + ".md";
    if (!cap.dl) { showCopy(text, name); return; }
    $("btn-save").disabled = true;
    cap.dl.save({ filename: name, data: text })
      .then(function () { status("Saved " + name + ". Upload it to Research Smarter next time and say “continue my research”.", "ok"); })
      .catch(function (e) {
        if (e && e.code === "declined") { status("Save cancelled.", "warn"); return; }
        showCopy(text, name);
      })
      .finally(function () { $("btn-save").disabled = false; });
  };

  function showCopy(text, name) {
    var v = $("view");
    var box = el("section", "panel");
    box.append(el("h2", null, "Copy your research log"));
    box.append(el("p", "muted", "This view can't save files, so copy the text below into a file named " + name + "."));
    var ta = el("textarea"); ta.readOnly = true; ta.value = text; ta.id = "copy-text"; ta.setAttribute("aria-label", "Research log text to copy");
    var b = el("button", "primary", "Copy text"); b.type = "button";
    b.onclick = function () {
      var done = function () { status("Copied.", "ok"); };
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(text).then(done, function () { ta.select(); status("Select all and copy the text.", "warn"); });
      } else { ta.select(); status("Select all and copy the text.", "warn"); }
    };
    box.append(ta, b);
    v.prepend(box);
  }

  /* ---------- Start ---------- */

  $("btn-read").onclick = function () {
    if (state.view === "read") return;
    openReader(null, state.parsed ? state.view : "empty");
  };

  render();

  var has = !!(window.claude && window.claude.use);
  if (!has) {
    status("Open this notebook in Claude to keep your project between visits. You can still load and save a log here.", "warn");
    return;
  }
  window.claude.use("downloads").then(function (dl) { cap.dl = dl; });
  window.claude.use("sample").then(function (s) {
    cap.sample = s;
    cap.sampleWhy = s ? null : "not_available";
    if (state.view === "read" && state.reader && state.reader.article && !state.reader.finished) renderRead();
  });
  Promise.all([window.claude.use("db"), window.claude.use("user")]).then(function (pair) {
    cap.db = pair[0]; cap.user = pair[1];
    if (!cap.db || !cap.user) {
      status("This view can't keep your notebook between visits. You can still load a log and save it as a file.", "warn");
      return null;
    }
    return cap.user.id();
  }).then(function (uid) {
    if (!cap.db || !cap.user) return;
    if (!uid) {
      status("Sign in to Claude to keep your notebook between visits. You can still load a log and save it as a file.", "warn");
      return;
    }
    cap.uid = uid;
    var timer = setTimeout(function () { status("Still looking for your saved notebook…", "warn"); }, 10000);
    return cap.db.doc("data/users/" + uid + "/project").get().then(function (snap) {
      clearTimeout(timer);
      if (snap.exists && !state.parsed) {
        var d = snap.data();
        var parsed = d && d.markdown ? LogFormat.parse(d.markdown) : { ok: false };
        if (parsed.ok) {
          state.markdown = d.markdown; state.parsed = parsed; state.isExample = false;
          render(); status("Welcome back. Your project is where you left it.", "ok");
          return;
        }
      }
      if (!state.parsed) status("");
    }).catch(function (e) {
      clearTimeout(timer);
      status("Your saved notebook couldn't be loaded (" + e.code + "). You can load your log file again.", "warn");
    });
  });
})();
</script>
